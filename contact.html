    <title>Contact Us - Pet Store</title>

<body>
    <section id="banner">
        <nav class="navbar">
            <div class="logo">🐾 Cute Pets Hub 🐾</div>
            <div class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="contact.html">Contact</a>

            </div>

        </section>
    <div class="container">
        <div class="contact-box">
            <h2>Contact Us</h2>
            <p>We would love to hear from you! Reach out to us for any queries.</p>
            <form>
                <input type="text" placeholder="Your Name" required>

                <textarea placeholder="Your Message" rows="4" required></textarea>
                <button type="submit">Send Message</button>
            </form>
            <div class="contact-info">
                <p><strong>Email:</strong> support@petstore.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Address:</strong> 123 Pet Street, Petland, India</p>
            </div>
        </div>
    </div>
</body>
